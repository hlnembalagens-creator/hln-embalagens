<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendas — Portal HLN</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<header class="admin-header">
  <div class="admin-brand">HLN Portal</div>
  <nav class="admin-nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="pedido.html">Pedido</a>
    <a href="vendas.html" class="active">Vendas</a>
    <a href="clientes.html">Clientes</a>
    <a href="catalogo.html" data-role-admin>Catálogo</a>
    <a href="estoque.html">Estoque</a>
    <a href="financeiro.html" data-role-admin>Financeiro</a>
    <a href="calculadora-custo.html" data-role-admin>Calculadora de Custo</a>
    <a href="mensagens.html">Mensagens</a>
    <a href="usuarios.html" data-role-full-admin>Usuários</a>
  </nav>
  <div class="admin-user">
    <span>Olá, <span data-user-name>—</span></span>
    <a href="trocar-senha.html" style="color:#cfd9ea; font-size:0.85rem;">Trocar senha</a>
    <button data-logout>Sair</button>
  </div>
</header>

<main class="admin-main">
  <h1 class="admin-title">Vendas</h1>

  <div class="admin-card">
    <div class="form-grid" style="margin-bottom:0;">
      <div class="form-field span-2">
        <label for="filtro-busca">Buscar por cliente ou número</label>
        <input type="text" id="filtro-busca" placeholder="Ex: Ra-Chu, 23...">
      </div>
      <div class="form-field">
        <label for="filtro-tipo">Tipo</label>
        <select id="filtro-tipo">
          <option value="">Todos</option>
          <option value="pedido">Pedido</option>
          <option value="orcamento">Orçamento</option>
        </select>
      </div>
      <div class="form-field">
        <label for="filtro-status">Pagamento</label>
        <select id="filtro-status">
          <option value="">Todos</option>
          <option value="pago">Pago</option>
          <option value="pendente">Pendente</option>
        </select>
      </div>
      <div class="form-field" data-role-admin>
        <label for="filtro-vendedor">Vendedor</label>
        <select id="filtro-vendedor">
          <option value="">Todos</option>
        </select>
      </div>
    </div>
  </div>

  <div class="admin-card">
    <div class="table-scroll">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Nº</th>
            <th>Cliente</th>
            <th>Data</th>
            <th>Pagamento</th>
            <th>Valor</th>
            <th data-role-admin>Vendedor</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="vendas-tbody">
          <tr><td colspan="8">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/admin-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/toast.js"></script>
<script src="js/historico.js"></script>
<script src="js/vendas.js"></script>
</body>
</html>
