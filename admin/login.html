<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Portal HLN</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="login-shell">
  <div class="login-card">
    <div class="brand-mark" role="img" aria-label="HLN Embalagens e Equipamentos">
      <span class="bm-label" aria-hidden="true">Embalagens</span>
      <svg class="bm-arc" viewBox="0 0 200 40" aria-hidden="true">
        <path d="M6 38 Q100 2 194 38"/>
        <path d="M30 38 Q100 14 170 38"/>
        <path d="M54 38 Q100 24 146 38"/>
      </svg>
      <span class="bm-hln" aria-hidden="true">HLN</span>
      <svg class="bm-arc" viewBox="0 0 200 40" aria-hidden="true">
        <path d="M6 2 Q100 38 194 2"/>
        <path d="M30 2 Q100 26 170 2"/>
        <path d="M54 2 Q100 16 146 2"/>
      </svg>
      <span class="bm-label" aria-hidden="true">e Equipamentos</span>
    </div>
    <h1>Portal Administrativo</h1>

    <form id="login-form">
      <div class="form-field" style="margin-bottom:14px;">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-field" style="margin-bottom:20px;">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <p id="login-error" class="error-message" style="display:none;"></p>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/admin-config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var username = document.getElementById('username').value;
    var password = document.getElementById('password').value;
    var errorEl = document.getElementById('login-error');
    var btn = document.getElementById('login-btn');

    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    var { error } = await supabaseClient.auth.signInWithPassword({
      email: usernameToEmail(username),
      password: password
    });

    if (error) {
      errorEl.textContent = 'Usuário ou senha inválidos.';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }

    location.href = 'pedido.html';
  });
</script>
</body>
</html>
